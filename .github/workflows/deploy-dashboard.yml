name: Deploy dashboard page

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "assets/**"
      - "data/naver_news.json"
      - "data/market_indices.json"
      - "data/market_heatmap.json"
      - "data/financial_n_estimates.json"
      - "data/investment_screens.json"
      - "data/us_sec_filings.json"
      # AI briefing updates can be deployed without rerunning the full collectors.
      - "data/ai_market_briefing.json"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_run:
    workflows:
      - "Update dashboard news"
      - "Build DART 10-year financial panel"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out latest dashboard
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare dashboard-only artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '_site/' \
            --exclude 'data/dart_financial_panel.json' \
            --exclude 'data/dart_financial_panel/' \
            --exclude 'data/dart_financial_raw/' \
            ./ _site/

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

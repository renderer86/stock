name: Update market data

on:
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/update-market-data.yml"
  schedule:
    # 08:30 KST Monday-Friday (23:30 UTC Sunday-Thursday)
    - cron: "30 23 * * 0-4"
    # 16:30 KST Monday-Friday (07:30 UTC Monday-Friday)
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      profile:
        description: Collection profile
        required: true
        default: all
        type: choice
        options:
          - all
          - market-close
          - rates

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Select collection profile
        id: profile
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            profile="${{ inputs.profile }}"
          elif [[ "${{ github.event.schedule }}" == "30 23 * * 0-4" ]]; then
            profile="rates"
          else
            profile="market-close"
          fi
          echo "value=${profile}" >> "$GITHUB_OUTPUT"
          echo "Selected profile: ${profile}"

      - name: Crawl market data
        run: python scheduled_update.py "${{ steps.profile.outputs.value }}"

      - name: Commit refreshed JSON
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No market-data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): automated market update"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Notify Telegram on failure
        if: failure()
        run: >-
          python telegram_notify.py
          --status failure
          --profile "${{ steps.profile.outputs.value }}"

      - name: Notify Telegram on success
        if: success()
        run: >-
          python telegram_notify.py
          --status success
          --profile "${{ steps.profile.outputs.value }}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

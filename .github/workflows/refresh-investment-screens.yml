name: Refresh Buffett and quality screens

on:
  workflow_dispatch:
    inputs:
      bulk_mode:
        description: ZIP first, ZIP only, or resume API gaps from saved ZIPs
        type: choice
        default: auto
        options: [auto, only, skip]
      max_companies:
        description: Maximum API company attempts per run (0 = all)
        type: string
        default: "500"
      max_requests:
        description: Maximum HTTP requests including retries and ZIP downloads
        type: string
        default: "1000"
      year:
        description: Fiscal year (0 = latest due period; set with quarter)
        type: string
        default: "0"
      quarter:
        description: Quarter (0 = automatic, 2 = half-year)
        type: choice
        default: "0"
        options: ["0", "1", "2", "3"]
  workflow_run:
    workflows:
      - "Build DART 10-year financial panel"
      - "Update market data"
    types:
      - completed

permissions:
  contents: write

concurrency:
  # Annual and quarterly collectors both update the raw archive index/panel.
  group: dart-financial-data
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}

    steps:
      - name: Check out latest data
        uses: actions/checkout@v6
        with:
          # A queued run must use the newest panel and market data rather than
          # the workflow_run event's older head SHA.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate local inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f data/dart_financial_panel.json
          test -f data/market_sum.json
          test -f config/financial_n_engine.json

      - name: Build empirical N and investment screens
        shell: bash
        run: |
          set -euo pipefail
          python -u crawler_dart_debt_notes.py
          python -u rebuild_financial_metrics.py
          python -u crawler_naver_year_end_prices.py
          python -u estimate_financial_n.py --config config/financial_n_engine.json
          python -u build_investment_screens.py

      - name: Import quarterly ZIPs and resume missing company statements
        id: interim
        continue-on-error: true
        env:
          BULK_MODE: ${{ inputs.bulk_mode || 'auto' }}
          MAX_COMPANIES: ${{ inputs.max_companies || '500' }}
          MAX_REQUESTS: ${{ inputs.max_requests || '1000' }}
          FISCAL_YEAR: ${{ inputs.year || '0' }}
          QUARTER: ${{ inputs.quarter || '0' }}
        run: >-
          python -u crawler_dart_financial_interim.py
          --scope all --bulk-mode "$BULK_MODE"
          --max-companies "$MAX_COMPANIES" --max-requests "$MAX_REQUESTS"
          --max-runtime-minutes 15 --year "$FISCAL_YEAR" --quarter "$QUARTER"

      - name: Apply available quarterly data to screens
        run: |
          python -u build_investment_screens.py
          python -u build_valuation_metrics.py --fetch-prior-balances
          python -u build_data_manifest.py

      - name: Commit refreshed screens
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/naver_year_end_prices.json \
            data/financial_n_estimates.json \
            data/dart_financial_panel.json \
            data/dart_financial_panel/ \
            data/investment_screens.json \
            data/valuation_metrics.json \
            data/data_manifest.json
          if [[ -f data/dart_financial_interim.json ]]; then
            git add data/dart_financial_interim.json
          fi
          if [[ -d data/dart_financial_interim_progress ]]; then
            git add data/dart_financial_interim_progress/
          fi
          if [[ -d data/dart_financial_raw ]]; then
            git add data/dart_financial_raw/
          fi
          if [[ -f data/dart_corp_codes.json ]]; then
            git add data/dart_corp_codes.json
          fi
          if [[ -f data/dart_debt_notes.json ]]; then
            git add data/dart_debt_notes.json
          fi

          if git diff --cached --quiet; then
            echo "No Buffett or quality screen changes to commit."
            exit 0
          fi

          git commit -m "chore(data): refresh Buffett and quality screens"

          for attempt in 1 2 3; do
            echo "Sync attempt ${attempt}/3 with origin/${TARGET_BRANCH}"
            git fetch origin "${TARGET_BRANCH}"
            if ! git rebase -X theirs "origin/${TARGET_BRANCH}"; then
              git rebase --abort || true
              echo "::error::Screen outputs conflicted with newer remote data."
              exit 1
            fi
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "Buffett and quality screens pushed successfully."
              exit 0
            fi
            echo "Remote changed during push; retrying after 3 seconds."
            sleep 3
          done

          echo "::error::Failed to push refreshed screens after 3 attempts."
          exit 1

      - name: Upload screen artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investment-screens-${{ github.run_id }}
          path: |
            data/financial_n_estimates.json
            data/naver_year_end_prices.json
            data/investment_screens.json
            data/valuation_metrics.json
            data/dart_financial_interim.json
            data/dart_financial_interim_progress/*.json
            data/dart_financial_raw/index.json
            data/dart_financial_raw/20*/bulk/1101*.json.gz
            data/dart_financial_raw/20*/api/interim_*.json.gz
            data/dart_corp_codes.json
            data/data_manifest.json
          retention-days: 14

      - name: Report quarterly collection failure after saving checkpoints
        if: steps.interim.outcome == 'failure'
        run: |
          echo "::error::Quarterly collection failed. Saved ZIPs and partial progress were retained; rerun the same inputs to resume."
          exit 1

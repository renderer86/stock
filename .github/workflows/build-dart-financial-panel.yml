name: Build DART 10-year financial panel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Existing panel handling
        required: true
        default: resume
        type: choice
        options:
          - resume
          - refresh-latest
          - rebuild
      years:
        description: Number of completed fiscal years
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "5"
          - "15"
      universe_limit:
        description: Optional company limit (0 = all)
        required: true
        default: "0"
        type: string

permissions:
  contents: write

concurrency:
  group: build-dart-financial-panel
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate DART secret
        shell: bash
        run: |
          if [[ -z "${DART_API_KEY}" ]]; then
            echo "::error::DART_API_KEY repository secret is not registered."
            exit 1
          fi

      - name: Build annual financial panel
        id: crawl
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --years "${{ inputs.years }}"
            --limit "${{ inputs.universe_limit }}"
          )

          case "${{ inputs.mode }}" in
            rebuild)
              args+=(--reset)
              ;;
            refresh-latest)
              args+=(--refresh-latest)
              ;;
            resume)
              ;;
            *)
              echo "::error::Unknown mode: ${{ inputs.mode }}"
              exit 1
              ;;
          esac

          python -u crawler_dart_financial_panel.py "${args[@]}"

      - name: Commit panel or partial checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data/dart_financial_panel.json ]]; then
            echo "No panel/checkpoint file was created."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dart_financial_panel.json
          if git diff --cached --quiet; then
            echo "No DART panel changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh DART financial panel"

          for attempt in 1 2 3; do
            echo "Sync attempt ${attempt}/3 with origin/${GITHUB_REF_NAME}"
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::Panel checkpoint conflicted with newer remote data."
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "DART panel pushed successfully."
              exit 0
            fi
            echo "Remote changed during push; retrying after 3 seconds."
            sleep 3
          done

          echo "::error::Failed to push the DART panel after 3 attempts."
          exit 1

      - name: Upload panel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-financial-panel-${{ github.run_id }}
          path: data/dart_financial_panel.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Report incomplete crawl
        if: steps.crawl.outcome != 'success'
        shell: bash
        run: |
          echo "::error::The crawl was incomplete. A partial checkpoint was committed when available; rerun with mode=resume."
          exit 1

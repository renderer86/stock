name: Build DART 10-year financial panel

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Collection scope
        required: true
        default: bulk-and-supplements
        type: choice
        options:
          - bulk-and-supplements
          - bulk-only
          - supplements-only
          - core-only
          - legacy-api-details
      mode:
        description: Existing panel handling
        required: true
        default: resume
        type: choice
        options:
          - resume
          - refresh-latest
          - rebuild
      years:
        description: Number of completed fiscal years
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "5"
          - "15"
      universe_limit:
        description: Optional company limit (0 = all)
        required: true
        default: "0"
        type: string
      detail_request_budget:
        description: Gap/share/dividend API requests in this run (resume later)
        required: true
        default: "5000"
        type: choice
        options:
          - "1000"
          - "5000"
          - "10000"

permissions:
  contents: write

concurrency:
  group: build-dart-financial-panel
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Manual runs can queue behind a long-running panel build. Resume
          # from the branch tip available when this job actually starts.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate DART secret
        if: inputs.scope != 'bulk-only'
        shell: bash
        run: |
          if [[ -z "${DART_API_KEY}" ]]; then
            echo "::error::DART_API_KEY repository secret is not registered."
            exit 1
          fi

      - name: Build annual core panel
        id: core
        if: inputs.scope == 'bulk-and-supplements' || inputs.scope == 'core-only'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --years "${{ inputs.years }}"
            --limit "${{ inputs.universe_limit }}"
          )

          case "${{ inputs.mode }}" in
            rebuild)
              args+=(--reset)
              ;;
            refresh-latest)
              args+=(--refresh-latest)
              ;;
            resume)
              ;;
            *)
              echo "::error::Unknown mode: ${{ inputs.mode }}"
              exit 1
              ;;
          esac

          python -u crawler_dart_financial_panel.py "${args[@]}"

      - name: Import OpenDART annual bulk ZIP files
        id: bulk
        if: inputs.scope == 'bulk-and-supplements' || inputs.scope == 'bulk-only'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --years "${{ inputs.years }}"
            --limit "${{ inputs.universe_limit }}"
          )

          case "${{ inputs.mode }}" in
            rebuild)
              args+=(--reset-bulk)
              ;;
            refresh-latest)
              args+=(--refresh-latest)
              ;;
            resume)
              ;;
            *)
              echo "::error::Unknown mode: ${{ inputs.mode }}"
              exit 1
              ;;
          esac

          python -u crawler_dart_financial_bulk.py "${args[@]}"

      - name: Enrich API gaps, share totals and dividend matters
        id: details
        if: >-
          (inputs.scope == 'bulk-and-supplements' && steps.bulk.outcome != 'failure') ||
          inputs.scope == 'supplements-only' ||
          inputs.scope == 'legacy-api-details'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --limit "${{ inputs.universe_limit }}"
            --max-requests "${{ inputs.detail_request_budget }}"
          )

          if [[ "${{ inputs.scope }}" == "legacy-api-details" ]]; then
            args+=(--supplement-profile all)
          else
            args+=(--supplement-profile screens)
          fi

          python -u crawler_dart_financial_details.py "${args[@]}"

      - name: Build empirical N and investment screens
        id: analytics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data/dart_financial_panel.json ]]; then
            echo "DART panel does not exist yet; analytics are skipped."
            exit 0
          fi
          python -u estimate_financial_n.py --config config/financial_n_engine.json
          python -u build_investment_screens.py
          python -u build_data_manifest.py

      - name: Commit panel or partial checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data/dart_financial_panel.json ]]; then
            echo "No panel/checkpoint file was created."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files=(data/dart_financial_panel.json)
          shopt -s nullglob
          shard_files=(data/dart_financial_panel/*.json)
          files+=("${shard_files[@]}")
          [[ -d data/dart_financial_raw ]] && files+=(data/dart_financial_raw)
          [[ -f data/financial_n_estimates.json ]] && files+=(data/financial_n_estimates.json)
          [[ -f data/investment_screens.json ]] && files+=(data/investment_screens.json)
          [[ -f data/data_manifest.json ]] && files+=(data/data_manifest.json)
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "No DART panel changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh DART financial panel"

          for attempt in 1 2 3; do
            echo "Sync attempt ${attempt}/3 with origin/${GITHUB_REF_NAME}"
            git fetch origin "${GITHUB_REF_NAME}"
            # The checkpoint produced by this run is newer than any
            # overlapping automated checkpoint, including binary raw shards.
            if ! git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::Panel checkpoint conflicted with newer remote data."
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "DART panel pushed successfully."
              exit 0
            fi
            echo "Remote changed during push; retrying after 3 seconds."
            sleep 3
          done

          echo "::error::Failed to push the DART panel after 3 attempts."
          exit 1

      - name: Upload panel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-financial-panel-${{ github.run_id }}
          path: |
            data/dart_financial_panel.json
            data/dart_financial_panel/*.json
            data/dart_financial_raw/index.json
            data/dart_financial_raw/**/*.json.gz
            data/financial_n_estimates.json
            data/investment_screens.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Report crawler failure
        if: >-
          (steps.core.outcome == 'failure') ||
          (steps.bulk.outcome == 'failure') ||
          (steps.details.outcome == 'failure') ||
          (steps.analytics.outcome == 'failure')
        shell: bash
        run: |
          echo "::error::A crawler failed. A partial checkpoint was committed when available; inspect the failed step and rerun with mode=resume."
          exit 1
